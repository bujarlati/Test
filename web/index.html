<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Idle Forest</title>
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <section id="profileGate" class="profile-gate">
      <div class="profile-card">
        <div class="profile-preview">
          <div id="profileAvatar" class="profile-avatar male"></div>
          <div>
            <h1>林地挂机</h1>
            <p>创建角色</p>
          </div>
        </div>
        <div class="profile-form">
          <div id="accountPanel" class="account-panel">
            <label class="field">
              <span>账号</span>
              <input id="accountUsernameInput" maxlength="32" placeholder="输入账号" autocomplete="username" />
            </label>
            <label class="field">
              <span>密码</span>
              <input id="accountPasswordInput" type="password" maxlength="64" placeholder="输入密码" autocomplete="current-password" />
            </label>
            <div class="profile-actions">
              <button id="loginButton" type="button">登录</button>
              <button id="registerButton" class="muted" type="button">创建账号</button>
            </div>
            <p id="accountStatusText" class="profile-status"></p>
          </div>

          <div id="characterPanel" class="character-panel hidden">
            <div class="character-head">
              <div>
                <span>当前账号</span>
                <strong id="accountNameText">-</strong>
              </div>
              <button id="logoutButton" class="muted" type="button">退出</button>
            </div>
            <div id="characterSlotList" class="character-slots"></div>
          </div>

          <div id="creationPanel" class="creation-panel hidden">
            <label class="field">
              <span>名字</span>
              <input id="characterNameInput" maxlength="24" placeholder="输入角色名" autocomplete="off" />
            </label>
            <div class="field">
              <span>性别</span>
              <div class="segmented">
                <button id="genderMaleButton" class="active" type="button" data-gender="male">男</button>
                <button id="genderFemaleButton" type="button" data-gender="female">女</button>
              </div>
            </div>
            <div class="roll-head">
              <strong>初始天赋</strong>
              <span id="rollCountText">剩余 3 次</span>
            </div>
            <div id="creationTalentList" class="creation-talents"></div>
            <div class="profile-actions">
              <button id="rollTalentButton" type="button">Roll 天赋</button>
              <button id="confirmCharacterButton" class="muted" type="button" disabled>确认角色</button>
              <button id="cancelCreationButton" class="muted" type="button">取消</button>
            </div>
            <p id="profileStatusText" class="profile-status"></p>
          </div>
        </div>
      </div>
    </section>

    <main class="app">
      <header class="topbar">
        <div>
          <h1>林地挂机</h1>
          <p id="statusText">连接中</p>
        </div>
        <div class="top-actions">
          <button id="settingsButton" class="muted" type="button">设置</button>
          <button id="newCharacterButton" class="muted" type="button">新角色</button>
          <div class="resource">
            <span id="goldText">0</span>
            <small>金币</small>
          </div>
        </div>
      </header>

      <section class="hero-strip">
        <div class="stat"><span>等级</span><strong id="levelText">1</strong></div>
        <div class="stat exp-stat">
          <span>经验</span>
          <strong id="expText">0 / 0</strong>
          <div class="mini-meter"><div id="expProgressBar"></div></div>
        </div>
        <div class="stat wide"><span>生命</span><strong id="hpText">0 / 0</strong></div>
        <div class="stat"><span>攻击</span><strong id="attackText">0</strong></div>
        <div class="stat"><span>防御</span><strong id="defenseText">0</strong></div>
        <div class="stat"><span>移速</span><strong id="moveSpeedText">0 / 秒</strong></div>
        <div class="stat"><span>攻速</span><strong id="attackSpeedText">0 / 秒</strong></div>
        <div class="stat"><span>回复</span><strong id="hpRegenText">0 / 秒</strong></div>
        <div class="stat"><span>战力</span><strong id="powerText">0</strong></div>
      </section>

      <section class="stage">
        <canvas id="gameCanvas" width="960" height="520"></canvas>
        <div id="reviveText" class="revive-banner hidden"></div>
        <div class="stage-hud">
          <div>
            <span id="modeText">森林</span>
            <strong id="riftStateText">普通挂机</strong>
          </div>
          <button id="enterRiftButton">进入秘境</button>
          <button id="leaveRiftButton" class="muted" disabled>离开秘境</button>
        </div>
      </section>

      <section class="controls">
        <button id="tickButton">推进 10 秒</button>
        <button id="deepenForestButton">深入森林</button>
        <button id="retreatForestButton" class="muted" disabled>远离森林</button>
        <button id="equipBestButton">自动装备</button>
        <button id="resetButton" class="muted">重置</button>
      </section>

      <section class="dashboard">
        <section class="panel">
          <div class="panel-head">
            <h2>秘境</h2>
            <span id="riftThemeText">未进入</span>
          </div>
          <div class="rift-meter">
            <div id="riftProgressBar"></div>
          </div>
          <dl class="facts">
            <div><dt>可挑战层</dt><dd id="unlockedFloorText">1</dd></div>
            <div><dt>推荐战力</dt><dd id="recommendedPowerText">0</dd></div>
            <div><dt>小怪进度</dt><dd id="minionProgressText">0 / 0</dd></div>
          </dl>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>宝箱怪</h2>
            <span id="mimicPityText">0 / 8</span>
          </div>
          <div class="rift-meter luck-meter">
            <div id="mimicPityBar"></div>
          </div>
          <dl class="facts">
            <div><dt>遭遇率</dt><dd id="mimicChanceText">0%</dd></div>
            <div><dt>红装保底</dt><dd id="pityRemainingText">8</dd></div>
            <div><dt>掉落</dt><dd>特殊套装</dd></div>
          </dl>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>天赋</h2>
            <span id="talentScrollText">卷轴 0</span>
          </div>
          <div id="talentList" class="talent-list"></div>
          <div id="talentCatalogText" class="catalog-note">目录 0 个</div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>已装备</h2>
          </div>
          <div id="equipmentSlotList" class="equipment-slots"></div>
          <div id="equippedList" class="item-list compact"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>背包</h2>
          </div>
          <div id="inventoryList" class="item-list"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>交易市场</h2>
          </div>
          <div id="marketList" class="item-list"></div>
        </section>

        <section class="panel events-panel">
          <div class="panel-head">
            <h2>事件</h2>
          </div>
          <div id="eventList" class="event-list"></div>
        </section>
      </section>
    </main>

    <section id="settingsPanel" class="settings-panel hidden" aria-hidden="true">
      <div class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="settings-head">
          <h2 id="settingsTitle">设置</h2>
          <button id="settingsCloseButton" class="muted" type="button">关闭</button>
        </div>
        <label class="setting-row">
          <span>暂停</span>
          <input id="pauseToggle" type="checkbox" />
        </label>
        <label class="setting-row">
          <span>音量</span>
          <input id="volumeSlider" type="range" min="0" max="100" value="70" />
        </label>
        <label class="setting-row">
          <span>语言</span>
          <select id="languageSelect">
            <option value="zh-CN">中文</option>
            <option value="en-US">English</option>
          </select>
        </label>
      </div>
    </section>

    <section id="listingPanel" class="listing-panel hidden" aria-hidden="true">
      <div class="listing-dialog" role="dialog" aria-modal="true" aria-labelledby="listingTitle">
        <div class="listing-head">
          <h2 id="listingTitle">挂售价格</h2>
          <button id="listingCancelButton" class="muted" type="button">取消</button>
        </div>
        <div id="listingItemPreview" class="listing-preview"></div>
        <label class="listing-field">
          <span id="listingPriceLabel">挂售价格</span>
          <input id="listingPriceInput" type="number" min="1" step="1" value="30" inputmode="numeric" />
        </label>
        <div class="listing-actions">
          <button id="listingConfirmButton" type="button">确认挂售</button>
        </div>
      </div>
    </section>

    <script src="/web/app.js"></script>
  </body>
</html>
